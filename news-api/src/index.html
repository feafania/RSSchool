<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
        <link rel="stylesheet" href="global.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    </head>
    <body>
        <header>
            <div class="container container-header">
                <h1>News Portal</h1>
                <div class="header-search">
                    <form class="search__form">
                        <input type="text"  autocomplete="off" placeholder="Search..." aria-label="Search" class="search-input">
                        <button type="button" class="clear-button">&times;</button>
                        <button type="submit" class="search-button">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>
            </div>
        </header>
        <main>
            <div class="container container-main">
                <div class="sources buttons"></div>
                <div class="news"></div>
            </div>
        </main>
        <footer>
            <div class="container container-footer">
                <p class="copyright">
                    Copyright <a href="https://newsapi.org">NewsAPI</a>
                </p>
                <div class="footer">
                    <div class="footer__github">
                        <a target="_blank" href="https://github.com/feafania" class="footer-github" rel="noopener noreferrer">
                            <i class="fab fa-github section-contacts-logo"></i>
                            <span>feafania</span>
                        </a>
                    </div>
                    <div class="footer__year">2025</div>
                    <div class="footer__rsschool">
                        <a target="_blank" href="https://rs.school/courses/javascript" rel="noopener noreferrer">
                            <img src="../svg/rs-school-logo.svg" alt="RS School" class="footer-rsschool-logo">
                        </a>
                    </div>
                </div>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
