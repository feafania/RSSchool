<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        const basePath = "/feafania-JSFEEN2024Q4/fun-chat";
        const currentPath = location.pathname.replace(basePath, "");
        const newUrl =
          basePath +
          "/#" +
          currentPath.replace(/^\/+/, "") +
          location.search +
          location.hash;
        location.replace(newUrl);
      })();
    </script>
